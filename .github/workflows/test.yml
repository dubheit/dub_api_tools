name: Odoo Module Tests

on:
  push:
    branches:
      - 18.0
      - 19.0
  pull_request:
    branches:
      - 18.0
      - 19.0

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: odoo
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev

      - name: Install Odoo
        run: |
          wget -q -O odoo.deb https://nightly.odoo.com/${{ github.ref_name }}/nightly/deb/odoo_${{ github.ref_name }}.latest_all.deb
          sudo apt install -y ./odoo.deb

      - name: Install wkhtmltopdf
        run: |
          curl -o wkhtmltox.deb -sSL https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-3/wkhtmltox_0.12.6.1-3.jammy_amd64.deb
          sudo apt-get install -y --no-install-recommends ./wkhtmltox.deb

      - name: Create Odoo configuration file
        run: |
          cat > odoo.conf << EOF
          [options]
          addons_path = /usr/lib/python3/dist-packages/odoo/addons,${{ github.workspace }}
          db_host = localhost
          db_port = 5432
          db_name = odoo
          db_user = odoo
          db_password = odoo
          EOF

      - name: Install module
        run: |
          odoo -c odoo.conf -d odoo -i dub_oauth2_provider --stop-after-init --http-port=0

      - name: Run tests
        run: |
          odoo -c odoo.conf -d odoo --test-tags /dub_oauth2_provider --stop-after-init --http-port=0
